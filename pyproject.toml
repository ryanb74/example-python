[project]
name = "example-python"
version = "0.1.0"
description = "A basic Python project scaffolded with uv"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
example-python = "example_python.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_python"]

[tool.uv]
conflicts = [
    [
        { group = "dev" },
        { group = "prod" },
    ],
]

[tool.uv.sources]
testprojectuv = [
    { path = "../testprojectuv", group = "dev", editable = true },
    { git = "https://github.com/ryanb74/testprojectuv.git", group = "prod" },
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "testprojectuv",
]
prod = [
    "testprojectuv",
]
